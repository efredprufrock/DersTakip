<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raporlar Görüntüleyici</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        table { border-collapse: collapse; width: 100%; text-align: left; table-layout: auto; }
        
        thead { position: sticky; top: 0; z-index: 50; }
        
        th {
            background-color: #a8b0b9; 
            color: black;
            font-weight: 600;
            border: 1px solid #737373;
            padding: 6px 4px;
            cursor: pointer;
            user-select: none;
            position: sticky;
            top: -1px; 
            z-index: 50; 
            font-size: 0.75rem;
            line-height: 1.2;
            background-clip: padding-box; 
            outline: 1px solid #a8b0b9; 
            outline-offset: -1px;
        }
        th:hover { background-color: #8c939b; }
        td {
            border: 1px solid #9ca3af;
            padding: 6px 4px;
            color: #111827;
            font-size: 0.75rem;
            line-height: 1.3;
            word-wrap: break-word;
            word-break: break-word;
            position: relative;
            z-index: 1;
        }
        .sort-icon { margin-left: 2px; font-size: 0.8em; color: #374151; }

        /* Tüm dillere çok soluk, mat ve göz yormayan pastel tonlar atandı */
        .row-ingilizce { background-color: #faeceb; } /* Çok soluk kırmızı */
        .row-japonca { background-color: #fcf1e6; } /* Çok soluk turuncu */
        .row-korece { background-color: #e6f5ef; } /* Çok soluk su yeşili */
        .row-osmanlica { background-color: #f1f7e9; } /* Çok soluk fıstık yeşili */
        .row-yturkce { background-color: #f4eef9; } /* Çok soluk lila */
        .row-arapca { background-color: #e7f7ed; } /* Çok soluk nane yeşili */
        .row-fransizca { background-color: #eaf1fb; } /* Çok soluk mavi */
        .row-almanca { background-color: #f3f4f6; } /* Çok soluk gri */
        .row-italyanca { background-color: #faecf2; } /* Çok soluk pembe */
        .row-kurtce { background-color: #fbf7e2; } /* Çok soluk sarı */
        .row-zazaca { background-color: #f5ead6; } /* Çok soluk toprak rengi */
        .row-isaret { background-color: #eceff9; } /* Çok soluk indigo/buz mavisi */
        .row-rusca { background-color: #e6f6f8; } /* Çok soluk camgöbeği */
        .row-default { background-color: #ffffff; }
        
        tbody tr:hover td { filter: brightness(0.95); z-index: 2; }
    </style>
</head>
<body class="bg-gray-100 p-2 sm:p-4 font-sans h-screen flex flex-col overflow-hidden">

    <div class="w-full flex-1 mx-auto bg-white p-4 rounded-lg shadow-md border border-gray-200 flex flex-col min-h-0">
        <div class="flex justify-between items-center mb-4 border-b pb-4 shrink-0">
            <div>
                <h1 class="text-xl font-bold text-gray-800 tracking-tight">Eİİ, Şişli Dil Okulu, Ders Takip Sistemi</h1>
            </div>
            
            <div class="relative" title="Dosya Seç / Güncelle">
                <input type="file" id="fileUpload" accept=".xls,.xlsx" class="hidden" />
                <!-- Padding (p-3) kullanılarak yuvarlak ve minimalist bir ikon butona çevrildi -->
                <label for="fileUpload" id="uploadBtnLabel" class="inline-flex items-center justify-center p-3 bg-slate-800 text-white font-semibold rounded-full cursor-pointer hover:bg-slate-700 transition-all duration-300 shadow-md">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
                    </svg>
                </label>
            </div>
        </div>

        <div class="overflow-x-hidden border border-gray-400 rounded flex-1 overflow-y-auto shadow-inner bg-white relative min-h-0">
            
            <!-- Aktif Eğitimler Tablosu -->
            <table id="dataTable" class="hidden">
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
            </table>

            <!-- Tamamlanmış Eğitimler Bölümü -->
            <div id="completedSection" class="hidden mt-10 border-t-4 border-gray-400">
                <h2 class="text-lg font-bold text-gray-700 p-3 bg-gray-200">✅ Tamamlanmış Eğitimler</h2>
                <table class="w-full text-left table-auto border-collapse">
                    <thead id="completedTableHead"></thead>
                    <tbody id="completedTableBody" class="opacity-60 grayscale-[30%]"></tbody>
                </table>
            </div>
            
            <div id="emptyState" class="text-center py-20 text-gray-400">
                <svg class="animate-spin mx-auto h-12 w-12 mb-3 text-gray-300" id="loadingIcon" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <p id="emptyText">Buluttan veriler kontrol ediliyor...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAYsp2VRwhd84DUzDOdryZllxYYgD-FO78",
            authDomain: "ibbderstakip.firebaseapp.com",
            projectId: "ibbderstakip",
            storageBucket: "ibbderstakip.firebasestorage.app",
            messagingSenderId: "619222529088",
            appId: "1:619222529088:web:ff1d9ea58ea295c205dba5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.manualDataCache = {};
        window.mappedData = [];
        window.currentSortCol = null;
        window.sortAsc = true;
        window.columnFilters = {}; 
        window.activeDropdown = null; 

        // Ekranın herhangi bir yerine tıklanınca açık olan filtre menüsünü kapatır
        document.addEventListener('click', () => {
            if (window.activeDropdown) {
                window.activeDropdown = null;
                window.renderTable();
            }
        });

        // Butonun etrafındaki parlama (glow) efektini ayarlayan sistem
        window.setUploadStatus = function(status) {
            const btn = document.getElementById('uploadBtnLabel');
            if (!btn) return;
            
            // Tüm glow renklerini temizle
            btn.classList.remove('ring-2', 'ring-green-400', 'shadow-[0_0_15px_rgba(34,197,94,0.6)]',
                                 'ring-yellow-400', 'shadow-[0_0_15px_rgba(234,179,8,0.6)]',
                                 'ring-red-400', 'shadow-[0_0_15px_rgba(239,68,68,0.6)]');
            
            // Duruma göre ilgili rengi ekle
            if (status === 'success') {
                btn.classList.add('ring-2', 'ring-green-400', 'shadow-[0_0_15px_rgba(34,197,94,0.6)]'); // YEŞİL
            } else if (status === 'warning') {
                btn.classList.add('ring-2', 'ring-yellow-400', 'shadow-[0_0_15px_rgba(234,179,8,0.6)]'); // SARI
            } else if (status === 'error') {
                btn.classList.add('ring-2', 'ring-red-400', 'shadow-[0_0_15px_rgba(239,68,68,0.6)]'); // KIRMIZI
            }
        };

        window.loadInitialData = async function() {
            try {
                const extraRef = doc(db, "raporlar", "ekstra_veriler");
                const extraSnap = await getDoc(extraRef);
                if (extraSnap.exists()) {
                    window.manualDataCache = extraSnap.data();
                }

                const metaRef = doc(db, "raporlar", "excel_meta");
                const metaSnap = await getDoc(metaRef);
                
                if (metaSnap.exists()) {
                    const totalChunks = metaSnap.data().totalChunks;
                    let fullData = [];
                    
                    for (let i = 0; i < totalChunks; i++) {
                        const chunkSnap = await getDoc(doc(db, "raporlar", `excel_chunk_${i}`));
                        if (chunkSnap.exists()) {
                            fullData = fullData.concat(JSON.parse(chunkSnap.data().data));
                        }
                    }
                    
                    window.processData(fullData);
                    document.getElementById('emptyState').classList.add('hidden');
                    document.getElementById('dataTable').classList.remove('hidden');
                    window.renderTable();
                    window.setUploadStatus('success'); // Veriler başarıyla yüklendi (Yeşil Glow)
                } else {
                    document.getElementById('loadingIcon').classList.add('hidden');
                    document.getElementById('emptyText').innerHTML = "Henüz buluta bir dosya yüklenmedi.<br>Lütfen bir Excel dosyası yükleyin.";
                    window.setUploadStatus('warning'); // Veritabanı boş (Sarı Glow)
                }
            } catch (e) {
                console.error("Buluttan veri çekilirken hata oluştu:", e);
                document.getElementById('emptyText').innerText = "Veri bağlantı hatası. Lütfen Firebase Rules ayarlarını kontrol edin.";
                window.setUploadStatus('error'); // Bağlantı hatası (Kırmızı Glow)
            }
        };

        window.saveExcelToFirebase = async function(rawData) {
            try {
                const CHUNK_SIZE = 250; 
                const totalChunks = Math.ceil(rawData.length / CHUNK_SIZE);
                
                await setDoc(doc(db, "raporlar", "excel_meta"), { totalChunks });

                for (let i = 0; i < totalChunks; i++) {
                    const chunk = rawData.slice(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE);
                    await setDoc(doc(db, "raporlar", `excel_chunk_${i}`), { data: JSON.stringify(chunk) });
                }
                console.log("Excel buluta başarıyla kaydedildi.");
                window.setUploadStatus('success'); // Yükleme başarılı (Yeşil Glow)
            } catch (e) {
                console.error("Excel Firebase'e kaydedilemedi:", e);
                alert("Veritabanı kayıt hatası. Firebase Rules ayarlarına izin verdiğinizden emin olun.");
                window.setUploadStatus('error'); // Yükleme başarısız (Kırmızı Glow)
            }
        };

        window.updateFirebaseData = async function(id, key, value, isCheckbox = false) {
            if (!window.manualDataCache[id]) window.manualDataCache[id] = { checks: {} };
            
            if (isCheckbox) {
                window.manualDataCache[id].checks[key] = value;
            } else {
                window.manualDataCache[id][key] = value;
            }

            try {
                await setDoc(doc(db, "raporlar", "ekstra_veriler"), window.manualDataCache);
            } catch (e) {
                console.error("Ekstra veriler Firebase'e kaydedilemedi:", e);
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            window.loadInitialData();
        });
    </script>

    <script>
        const columnsConfig = [
            { title: "HEM Kodu", excelKeys: ["hemkodu", "kurumkodu", "hemkod"] },
            { title: "Eğitim ID", excelKeys: ["eğitimid", "eğitimıd", "egitimid", "egitimıd", "dersid", "dersıd", "kursno", "id", "ıd"] },
            { title: "Eğitmen Adı", excelKeys: ["eğitmenadı", "egitmenadi", "eğitmen", "egitmen", "öğretmen", "ogretmen"] },
            { title: "Program Adı", excelKeys: ["programadı", "programadi", "branş", "brans", "kursadı", "kursadi"] },
            { title: "Ders Başlama Tarihi", excelKeys: ["başlamatarihi", "baslamatarihi", "dersbaşlamatarihi", "dersbaslamatarihi", "dbaşlama", "dbaslama", "başlama", "baslama"], extractType: "Ders" },
            { title: "Onay Başlama Tarihi", excelKeys: ["başlamatarihi", "baslamatarihi", "onaybaşlamatarihi", "onaybaslamatarihi", "obaşlama", "obaslama"], extractType: "Onay" },
            { title: "Onay Bitiş Tarihi", excelKeys: ["bitiştarihi", "bitistarihi", "onaybitiştarihi", "onaybitistarihi", "obitiş", "obitis"], extractType: "Onay" },
            { title: "Ders Bitiş Tarihi", excelKeys: ["bitiştarihi", "bitistarihi", "dersbitiştarihi", "dersbitistarihi", "dbitiş", "dbitis", "bitiş", "bitis"], extractType: "Ders" },
            { title: "Ders Günleri", excelKeys: ["gun", "gün", "dersgünleri", "dersgunleri", "günler", "gunler"] },
            { title: "Ders Saatleri", excelKeys: ["zaman", "derssaatleri", "saatler", "vakit", "saat"] },
            { title: "Derslik Bilgisi", excelKeys: ["derslik", "derslikbilgisi", "sınıf", "sinif", "mekan", "salon"] },
            { title: "Sınav Tarihleri", excelKeys: [], isManual: true }
        ];

        const dateColumns = ["Ders Başlama Tarihi", "Onay Başlama Tarihi", "Ders Bitiş Tarihi", "Onay Bitiş Tarihi"];

        function getSavedData(id) {
            return window.manualDataCache[id] || { checks: {} };
        }

        window.updateMappedData = function(rowId, colTitle, value) {
            let rowData = window.mappedData.find(r => r["Eğitim ID"] == rowId);
            if (rowData) rowData[colTitle] = value;
        };

        document.getElementById('fileUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                
                if(worksheet) {
                    let rawData = XLSX.utils.sheet_to_json(worksheet, {header: 1, defval: "", raw: false});
                    window.saveExcelToFirebase(rawData);
                    window.processData(rawData);
                    document.getElementById('emptyState').classList.add('hidden');
                    document.getElementById('dataTable').classList.remove('hidden');
                    window.renderTable();
                }
            };
            reader.readAsArrayBuffer(file);
        });

        function normalizeString(str) {
            if (!str) return '';
            let s = str.toString();
            s = s.replace(/İ/g, 'i').replace(/I/g, 'ı')
                 .replace(/Ö/g, 'ö').replace(/Ü/g, 'ü')
                 .replace(/Ş/g, 'ş').replace(/Ç/g, 'ç')
                 .replace(/Ğ/g, 'ğ');
            s = s.toLowerCase();
            s = s.replace(/[^a-z0-9ğüşıöç]/g, '');
            return s;
        }

        function parseDateCell(val, type) {
            if (!val) return "";
            let str = String(val).trim();
            if (str.toLowerCase().includes("ders:") || str.toLowerCase().includes("onay:")) {
                let regex = new RegExp(type + ":\\s*(.+?)(?:\\n|\\r|$)", "i");
                let match = str.match(regex);
                return match ? match[1].trim() : "";
            }
            return str;
        }

        window.processData = function(rawData) {
            let colMap = {};
            for (let r = 0; r < Math.min(rawData.length, 30); r++) {
                rawData[r].forEach((cell, c) => {
                    let s = normalizeString(cell);
                    columnsConfig.forEach(config => {
                        if (colMap[config.title] === undefined && config.excelKeys.includes(s)) {
                            colMap[config.title] = c;
                        }
                    });
                });
            }

            window.mappedData = [];
            
            rawData.forEach(rowArray => {
                let rowObj = {};
                let hasAnyData = false;
                
                columnsConfig.forEach(config => {
                    if(config.isManual) return; 

                    let colIdx = colMap[config.title];
                    let rawVal = "";
                    if (colIdx !== undefined && rowArray[colIdx] !== undefined && rowArray[colIdx] !== null) {
                        rawVal = String(rowArray[colIdx]).trim();
                    }
                    
                    let normVal = normalizeString(rawVal);
                    if (config.excelKeys.includes(normVal)) {
                        rawVal = "";
                    }

                    if (config.extractType && rawVal) {
                        rawVal = parseDateCell(rawVal, config.extractType);
                    }

                    if (dateColumns.includes(config.title) && rawVal) {
                        rawVal = rawVal.replace(/\./g, ' '); 
                    }
                    
                    rowObj[config.title] = rawVal;
                    if (rawVal !== "") hasAnyData = true;
                });

                let hasId = rowObj["Eğitim ID"] && rowObj["Eğitim ID"] !== "";
                let hasProgram = rowObj["Program Adı"] && rowObj["Program Adı"] !== "";

                if (hasId || hasProgram) {
                    window.mappedData.push(rowObj);
                } else if (hasAnyData && window.mappedData.length > 0) {
                    let lastRow = window.mappedData[window.mappedData.length - 1];
                    
                    Object.keys(rowObj).forEach(key => {
                        let newVal = rowObj[key];
                        let oldVal = String(lastRow[key] || "").trim();

                        if (newVal !== "") {
                            if (oldVal === "") {
                                lastRow[key] = newVal;
                            } 
                            else if (oldVal !== newVal) {
                                if (["Ders Günleri", "Ders Saatleri", "Derslik Bilgisi", "Eğitmen Adı"].includes(key)) {
                                    let oldParts = oldVal.split(",").map(p => p.trim());
                                    if (!oldParts.includes(newVal)) {
                                        lastRow[key] = oldVal + ", " + newVal;
                                    }
                                }
                            }
                        }
                    });
                }
            });

            window.mappedData.forEach(row => {
                let saved = getSavedData(row["Eğitim ID"]);
                row["Sınav Tarihleri"] = saved["Sınav Tarihleri"] || "";
            });
        };

        window.toggleStrikethrough = async function(checkbox, rowId, colTitle) {
            await window.updateFirebaseData(rowId, colTitle, checkbox.checked, true);
            window.renderTable(); 
        };

        window.handleDateSelection = function(input, rowId, colTitle) {
            if (!input.value) return;
            
            const monthNames = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
            const [year, month, day] = input.value.split("-");
            const formattedDate = `${day} ${monthNames[parseInt(month) - 1]} ${year}`;
            
            const editableDiv = input.parentElement.previousElementSibling;
            let currentText = editableDiv.textContent.trim();
            
            if (currentText === "") {
                editableDiv.textContent = formattedDate;
            } else {
                if (!currentText.includes(formattedDate)) {
                    editableDiv.textContent = currentText + ", " + formattedDate;
                }
            }
            
            window.updateMappedData(rowId, colTitle, editableDiv.textContent);
            window.updateFirebaseData(rowId, colTitle, editableDiv.textContent);
            input.value = "";
        };

        window.renderTable = function() {
            const thead = document.getElementById('tableHead');
            const tbody = document.getElementById('tableBody');
            const completedSection = document.getElementById('completedSection');
            const completedThead = document.getElementById('completedTableHead');
            const completedTbody = document.getElementById('completedTableBody');

            thead.innerHTML = '';
            tbody.innerHTML = '';
            completedThead.innerHTML = '';
            completedTbody.innerHTML = '';

            if (window.mappedData.length === 0) return;

            // Açılır menüden bir seçenek seçildiğinde
            window.handleDropdownFilter = function(colTitle, value) {
                if (value === "ALL") {
                    delete window.columnFilters[colTitle];
                } else {
                    window.columnFilters[colTitle] = value;
                }
                window.activeDropdown = null; // Seçim yapılınca menüyü kapat
                window.renderTable();
            };

            // Süzgeç ikonuna tıklandığında menüyü aç/kapat
            window.toggleDropdown = function(event, dropdownId) {
                event.stopPropagation();
                window.activeDropdown = window.activeDropdown === dropdownId ? null : dropdownId;
                window.renderTable();
            };

            const createHeader = (targetHead, isCompletedTable) => {
                const headerRow = document.createElement('tr');
                
                columnsConfig.forEach(config => {
                    const th = document.createElement('th');
                    th.className = "relative align-middle"; // Açılır menünün sınırlarını belirler
                    
                    let sortIcon = '≡';
                    if (window.currentSortCol === config.title) {
                        sortIcon = window.sortAsc ? '▲' : '▼';
                    }

                    // Bu sütundaki benzersiz (unique) verileri topla ve alfabetik sırala
                    let uniqueValues = [...new Set(window.mappedData.map(row => String(row[config.title] || "").trim()))].filter(v => v !== "").sort();
                    
                    let isActiveFilter = window.columnFilters[config.title];
                    let filterIconColor = isActiveFilter ? 'text-blue-600 font-bold' : 'text-gray-500';
                    let dropdownId = `${config.title}${isCompletedTable ? '-comp' : '-main'}`;

                    let dropdownHtml = '';
                    if (window.activeDropdown === dropdownId) {
                        let optionsHtml = `<div class="p-2 cursor-pointer hover:bg-gray-100 text-gray-800 ${!isActiveFilter ? 'font-bold bg-blue-50' : ''}" onclick="window.handleDropdownFilter('${config.title}', 'ALL')">Tümü</div>`;
                        
                        uniqueValues.forEach(val => {
                            let isSelected = window.columnFilters[config.title] === val;
                            // Tek tırnak (A1 Seviyesi 'vs') hatası almamak için replace kullanıldı
                            optionsHtml += `<div class="p-2 cursor-pointer hover:bg-gray-100 text-gray-800 border-t border-gray-200 ${isSelected ? 'font-bold bg-blue-50' : ''}" onclick="window.handleDropdownFilter('${config.title}', '${val.replace(/'/g, "\\'")}')">${val}</div>`;
                        });

                        dropdownHtml = `
                            <div class="absolute left-0 top-full mt-1 bg-white border border-gray-300 shadow-xl rounded max-h-60 overflow-y-auto z-[100] min-w-[150px] text-xs font-normal" onclick="event.stopPropagation()">
                                ${optionsHtml}
                            </div>
                        `;
                    }

                    th.innerHTML = `
                        <div class="flex items-center justify-between">
                            <div class="flex-grow flex items-center cursor-pointer" onclick="window.sortTable('${config.title}')">
                                ${config.title} <span class="sort-icon">${sortIcon}</span>
                            </div>
                            <div class="cursor-pointer ml-1 p-1 hover:bg-gray-200 rounded ${filterIconColor}" onclick="window.toggleDropdown(event, '${dropdownId}')" title="Filtrele">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-3 h-3">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 01-.659 1.591l-5.432 5.432a2.25 2.25 0 00-.659 1.591v2.927a2.25 2.25 0 01-1.244 2.013L9.75 21v-6.568a2.25 2.25 0 00-.659-1.591L3.659 7.409A2.25 2.25 0 013 5.818V4.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0112 3z" />
                                </svg>
                            </div>
                        </div>
                        ${dropdownHtml}
                    `;
                    headerRow.appendChild(th);
                });
                targetHead.appendChild(headerRow);
            };

            createHeader(thead, false);
            createHeader(completedThead, true);

            let completedCount = 0;

            // Seçilen filtrelere göre listeyi tam eşleşme ile (Exact Match) daralt
            let filteredData = window.mappedData.filter(row => {
                return Object.keys(window.columnFilters).every(col => {
                    let filterVal = window.columnFilters[col];
                    if (!filterVal) return true; // Tümü seçiliyse göster
                    let cellVal = String(row[col] || "").trim();
                    return cellVal === filterVal;
                });
            });

            filteredData.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = getRowColorClass(row); 
                let rowId = row["Eğitim ID"];
                let savedExtra = getSavedData(rowId);

                let isComplete = true;
                let hasAtLeastOneDate = false;

                for (let col of dateColumns) {
                    if (row[col] && String(row[col]).trim() !== "") {
                        hasAtLeastOneDate = true;
                        if (!savedExtra.checks || !savedExtra.checks[col]) {
                            isComplete = false;
                            break;
                        }
                    }
                }

                const isRowCompleted = hasAtLeastOneDate && isComplete;
                if (isRowCompleted) completedCount++;
                
                columnsConfig.forEach(config => {
                    const td = document.createElement('td');
                    let cellValue = row[config.title];
                    if (cellValue === true || cellValue === "true") cellValue = "☑";
                    
                    if (config.isManual) {
                        td.className = "group align-top";
                        td.innerHTML = `
                            <div class="flex items-start justify-between gap-1 w-full h-full">
                                <div contenteditable="true" 
                                     class="outline-none flex-grow min-w-[60px] min-h-[1.2rem] cursor-text break-words" 
                                     onblur="window.updateFirebaseData('${rowId}', '${config.title}', this.textContent); window.updateMappedData('${rowId}', '${config.title}', this.textContent);">${cellValue}</div>
                                <div class="relative w-4 h-4 mt-0.5 flex-shrink-0 text-gray-500 hover:text-gray-800 cursor-pointer opacity-50 group-hover:opacity-100 transition-opacity" title="Takvimden Seç">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5" />
                                    </svg>
                                    <input type="date" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" onchange="window.handleDateSelection(this, '${rowId}', '${config.title}')">
                                </div>
                            </div>
                        `;
                    }
                    else if (dateColumns.includes(config.title) && cellValue) {
                        let isChecked = savedExtra.checks && savedExtra.checks[config.title];
                        let spanClass = isChecked ? "line-through text-gray-400" : "transition-all duration-200";
                        
                        td.innerHTML = `
                            <div class="flex items-start gap-1">
                                <input type="checkbox" class="w-3 h-3 mt-1 text-blue-600 rounded border-gray-400 cursor-pointer shrink-0 relative z-10" 
                                       ${isChecked ? 'checked' : ''} 
                                       onchange="window.toggleStrikethrough(this, '${rowId}', '${config.title}')">
                                <span class="date-text ${spanClass} leading-tight relative z-10">${cellValue}</span>
                            </div>
                        `;
                    }
                    else {
                        td.textContent = cellValue;
                    }

                    tr.appendChild(td);
                });

                if (isRowCompleted) {
                    completedTbody.appendChild(tr);
                } else {
                    tbody.appendChild(tr);
                }
            });

            if (completedCount > 0) {
                completedSection.classList.remove('hidden');
            } else {
                completedSection.classList.add('hidden');
            }
        };

        const monthMap = {
            "ocak": 1, "şubat": 2, "subat": 2, "mart": 3, "nisan": 4, "mayıs": 5, "mayis": 5, "haziran": 6,
            "temmuz": 7, "ağustos": 8, "agustos": 8, "eylül": 9, "eylul": 9, "ekim": 10, "kasım": 11, "kasim": 11, "aralık": 12, "aralik": 12
        };

        function parseDateForSort(dateStr) {
            if (!dateStr) return null;
            let firstDate = String(dateStr).split(',')[0].trim();
            let parts = firstDate.split(/\s+/);
            if (parts.length >= 3) {
                let day = parseInt(parts[0], 10);
                let month = monthMap[parts[1].toLowerCase()] || 0;
                let year = parseInt(parts[2], 10);
                if (!isNaN(day) && month > 0 && !isNaN(year)) {
                    return (year * 10000) + (month * 100) + day; 
                }
            }
            return null; 
        }

        window.sortTable = function(col) {
            if (window.currentSortCol === col) {
                window.sortAsc = !window.sortAsc;
            } else {
                window.currentSortCol = col;
                window.sortAsc = true;
            }

            let dateColTitles = [...dateColumns, "Sınav Tarihleri"];

            window.mappedData.sort((a, b) => {
                let valA = a[col] !== undefined ? a[col] : "";
                let valB = b[col] !== undefined ? b[col] : "";
                
                if (dateColTitles.includes(col)) {
                    let dateA = parseDateForSort(valA);
                    let dateB = parseDateForSort(valB);
                    
                    if (dateA !== null || dateB !== null) {
                        if (dateA === null) return 1; 
                        if (dateB === null) return -1;
                        if (dateA < dateB) return window.sortAsc ? -1 : 1;
                        if (dateA > dateB) return window.sortAsc ? 1 : -1;
                        return 0;
                    }
                }

                if (!isNaN(valA) && !isNaN(valB) && valA !== "" && valB !== "") {
                    valA = Number(valA);
                    valB = Number(valB);
                } else {
                    valA = String(valA).toLowerCase();
                    valB = String(valB).toLowerCase();
                }

                if (valA < valB) return window.sortAsc ? -1 : 1;
                if (valA > valB) return window.sortAsc ? 1 : -1;
                return 0;
            });

            window.renderTable();
        };

        function getRowColorClass(row) {
            let langStr = String(row["Program Adı"] || "").trim().toLowerCase();
            if (!langStr) return 'row-default';
            if (langStr.includes('ingilizce') || langStr.includes('i̇ngilizce')) return 'row-ingilizce';
            if (langStr.includes('japonca')) return 'row-japonca';
            if (langStr.includes('korece')) return 'row-korece';
            if (langStr.includes('osmanlıca') || langStr.includes('osmanlica')) return 'row-osmanlica';
            if (langStr.includes('türkçe') || langStr.includes('turkce') || langStr.includes('yabancılar')) return 'row-yturkce';
            if (langStr.includes('arapça') || langStr.includes('arapca')) return 'row-arapca';
            if (langStr.includes('fransızca') || langStr.includes('fransizca')) return 'row-fransizca';
            if (langStr.includes('almanca')) return 'row-almanca';
            if (langStr.includes('rusça') || langStr.includes('rusca')) return 'row-rusca';
            if (langStr.includes('italyanca') || langStr.includes('i̇talyanca')) return 'row-italyanca';
            if (langStr.includes('kürtçe') || langStr.includes('kurtce')) return 'row-kurtce';
            if (langStr.includes('zazaca')) return 'row-zazaca';
            if (langStr.includes('işaret') || langStr.includes('isaret')) return 'row-isaret';
            return 'row-default';
        }
    </script>
</body>
</html>
